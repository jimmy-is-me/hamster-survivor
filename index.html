<!DOCTYPE html>
<html lang='zh-Hant'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>倉鼠球大冒險 Hamster Survivor</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<div id='wrap'>
<canvas id='c'></canvas>
<button id='speedBtn' title='Q / E 調整速度'>⏩ x1</button>
<button id='muteBtn' title='M 靜音'>🔊</button>
<div id='toast'></div>
<div id='start' class='panel show'>
<h1>🐹 倉鼠球大冒險</h1>
<h3>① 選擇角色</h3><div class='row' id='chars'></div>
<h3>② 選擇起始武器</h3><div class='row' id='weps'></div>
<h3>③ 選擇難度</h3><div class='row' id='diffs'></div>
<div id='desc'></div>
<button class='btn' id='startBtn'>開始遊戲</button>
<button class='btn sub' id='achBtn'>🏆 成就與解鎖</button>
<div class='hint'>電腦:← → 換角色、↑ ↓ 換武器、D 換難度、Enter 開始、T 成就|遊戲中 WASD 移動、Q/E 調整速度、P 暫停、M 靜音、F 全螢幕、升級按 1/2/3 選擇、R 重抽</div>
</div>
<div id='ach' class='panel'><h1>🏆 成就與解鎖</h1><div id='achCount'></div><div id='achList'></div><button class='btn' id='achBack'>返回</button></div>
<div id='lvl' class='panel mid'><h1 id='lvlT'>🌻 升級!選一個天賦</h1><div id='cards'></div><button class='btn sub' id='rerollBtn'>🎲 重抽</button></div>
<div id='end' class='panel mid'><h1 id='endT'></h1><p id='endS'></p><div id='endA'></div><button class='btn' id='againBtn'>回到選角畫面</button></div>
</div>
<script src='game.js'></script>
</body>
</html>
